# kubectl apply -f k8s/erling-open.yaml
# Create the secret first (never commit it):
#   kubectl -n websites create secret generic erling-open-secrets \
#     --from-literal=PARTY_CODE=<festkode> --from-literal=ADMIN_CODE=<arrangørkode>
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: erling-open-data2
  namespace: websites
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: erling-open
  namespace: websites
  labels:
    app: erling-open
spec:
  replicas: 1
  strategy:
    type: Recreate # SQLite on RWO storage: one writer, no rolling overlap
  selector:
    matchLabels:
      app: erling-open
  template:
    metadata:
      labels:
        app: erling-open
    spec:
      containers:
        - name: erling-open
          image: ghcr.io/danielkaldheim/erling-open:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: erling-open-secrets
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /api/state
              port: http
            initialDelaySeconds: 2
      imagePullSecrets:
        - name: ghcr-regcred
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: erling-open-data2
---
apiVersion: v1
kind: Service
metadata:
  name: erling-open-service
  namespace: websites
  labels:
    app: erling-open
spec:
  selector:
    app: erling-open
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: erling-open-ingress
  namespace: websites
  labels:
    app: erling-open
  annotations:
    cert-manager.io/issuer: letsencrypt-nginx
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600" # long-lived websockets
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: erling.crudus.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: erling-open-service
                port:
                  name: http
  tls:
    - hosts:
        - erling.crudus.dev
      secretName: erling-open-tls
